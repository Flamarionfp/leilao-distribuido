resolver 127.0.0.11 valid=5s ipv6=off;

upstream app {
  zone app 64k;
  server app-1:3000 resolve max_fails=2 fail_timeout=3s;
  server app-2:3000 resolve max_fails=2 fail_timeout=3s;
  server app-3:3000 resolve max_fails=2 fail_timeout=3s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;

  location /socket.io/ {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_connect_timeout 700ms;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 0;
  }

  location /api/ {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_connect_timeout 700ms;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 0;
    proxy_next_upstream_timeout 4s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
